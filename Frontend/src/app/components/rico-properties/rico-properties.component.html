<h2 mat-dialog-title>Add a property</h2>

<mat-dialog-content class="text-sm">
  <div class="section-label mb-1">The value is</div>
  <mat-chip-listbox aria-label="Kind of value" [value]="selectedFilter" (change)="onFilterChange($event.value)">
    <mat-chip-option value="literal">a literal</mat-chip-option>
    <mat-chip-option *ngFor="let predefinedRange of predefinedRanges" [value]="predefinedRange" [matTooltip]="predefinedRange">
      {{ getNameOfRicoTypeFromURL(predefinedRange) }}
    </mat-chip-option>
  </mat-chip-listbox>

  <div *ngIf="remainingRanges.length > 0" class="mt-2 flex items-center gap-2">
    <span class="text-xs text-gray-500">or an entity of type</span>
    <select (change)="onRangeChange($event)" class="flex-1 text-sm px-2 py-1 border rounded bg-white cursor-pointer border-gray-200">
      <option value="" [selected]="!remainingRanges.includes(selectedFilter ?? '')">any other type…</option>
      <option *ngFor="let remainingRange of remainingRanges" [value]="remainingRange" [selected]="remainingRange === selectedFilter">
        {{ getNameOfRicoTypeFromURL(remainingRange) }}
      </option>
    </select>
  </div>

  <div class="section-label mt-4 mb-1">Property ({{ filteredPredicates.length }})</div>
  <div class="border rounded-lg divide-y max-h-[40vh] overflow-y-auto border-gray-200 divide-gray-200">
    <button
      *ngFor="let prop of filteredPredicates"
      type="button"
      (click)="onCheckboxChange(prop)"
      class="w-full text-left px-3 py-1.5 hover:bg-blue-50 flex items-center gap-2"
      [matTooltip]="prop.uri"
    >
      <span class="flex-1 min-w-0">
        <span class="font-medium">{{ prop.label || getNameOfRicoTypeFromURL(prop.uri) }}</span>
        <span class="ml-1 text-xs text-gray-400">{{ getNameOfRicoTypeFromURL(prop.uri) }}</span>
      </span>
      <span class="px-1 rounded text-[10px]"
            [ngClass]="prop.kind === 'OBJECT_PROPERTY' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'">
        {{ prop.kind === 'OBJECT_PROPERTY' ? 'entity' : 'literal' }}
      </span>
    </button>
    <p *ngIf="!filteredPredicates.length" class="px-3 py-2 text-xs text-gray-500 italic">No property for this filter.</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
</mat-dialog-actions>
