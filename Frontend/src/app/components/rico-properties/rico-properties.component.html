<div class="p-5 h-full! w-full overflow-y-scroll">
    <label class="block text-xs font-medium text-gray-600 mb-1">Filters</label>

    <mat-chip-grid #chipGrid>
        <mat-chip-row
            *ngFor="let filter of filters"
        >
            {{filter}}
            <button 
                matChipRemove [attr.aria-label]="'remove ' + filter"
                (click)="removeFilter(filter)">
                <mat-icon>cancel</mat-icon>
            </button>
        </mat-chip-row>
            
    </mat-chip-grid>

    <div class="flex gap-2">
        <button
            (click)="filterPropertiesByKindValue('iri')"
            [class.bg-blue-600]="filterByKindValue === 'iri'"
            [class.text-white]="filterByKindValue === 'iri'"
            [class.bg-white]="filterByKindValue !== 'iri'"
            [class.text-gray-600]="filterByKindValue !== 'iri'"
            class="cursor-pointer! flex-1 text-sm py-1.5 rounded-md border border-gray-300 transition-colors font-medium">
            IRI 
        </button>
        <button
            (click)="filterPropertiesByKindValue('literal')"
            [class.bg-blue-600]="filterByKindValue === 'literal'"
            [class.text-white]="filterByKindValue === 'literal'"
            [class.bg-white]="filterByKindValue !== 'literal'"
            [class.text-gray-600]="filterByKindValue !== 'literal'"
            class="cursor-pointer! flex-1 text-sm py-1.5 rounded-md border border-gray-300 transition-colors font-medium">
            Literal
        </button>
    </div>

    <mat-divider class="my-4!"></mat-divider>

    <div class="gap-1 mt-4">  
        <label class="block text-sm font-medium text-gray-600 mb-1">The object of the property is : </label>
        <div class="flex gap-1">
            <mat-chip-row (click)="addRangeFilter(predefinedRange)" class="big-chip" *ngFor="let predefinedRange of predefinedRanges">
            <mat-icon matChipAvatar>{{ getIconFor(predefinedRange) }}</mat-icon>
            {{ predefinedRange }}
            </mat-chip-row>
        </div>
    </div>

    <div class="mt-4 w-full">
        <label class="block text-sm font-medium text-gray-600 mb-1">Other types : </label>
        <select
        (change)="onRangeChange($event)"
        class="flex-1 w-full text-sm border border-gray-300 rounded-md px-2 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">

        <option value="" disabled selected>Select a type of object...</option>

        <option *ngFor="let range of allRanges" [value]="range">
            {{getNameOfRicoTypeFromURL(range)}}
        </option>

        </select>
    </div>

    <mat-divider class="my-4!"></mat-divider>

    <div class="mt-4 w-full">
        <label class="block text-sm font-medium text-gray-600 mb-1">Select a property towards this type : </label>
    </div>

    <mat-radio-group class="flex-col gap-1" [(ngModel)]="association.predicate">
    <div *ngFor="let prop of filteredPredicates" class="list-none p-1.5 m-0">

        <mat-radio-button [value]="prop" (change)="onCheckboxChange(prop)">

            <span>
                {{ prop.label || prop.p }}
            </span>

            <span class="iri-badge ml-2!"
                *ngIf="prop.valueKind === 'iri'"
                matBadge="iri"
                matBadgeColor="primary"
                matBadgeSize="large">
            </span>

            <span class="literal-badge ml-2!"
                *ngIf="prop.valueKind === 'literal'"
                matBadge="literal"
                matBadgeColor="accent"
                matBadgeSize="large">
            </span>
       

        </mat-radio-button>

        <div *ngIf="association.predicate && association.predicate.label === prop.label" class="border m-2 border-blue-300 p-3">
            <label class="block text-xs font-medium text-gray-600 mb-1">Value</label>
            <!-- Value -->
            <div *ngIf="association.valueKind === 'iri'">

                <div class="flex items-center gap-2">
                    <button
                    (click)="createSubEntityToggle()"
                    type="button"
                    class="text-xs px-2 py-1 border border-gray-300 rounded-md bg-gray-100 hover:bg-gray-200">
                    +
                    </button>

                    <select
                    [(ngModel)]="association.value"
                    [ngModelOptions]="{standalone: true}"
                    class="flex-1 text-sm border border-gray-300 rounded-md px-2 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <option value="" disabled>Select a value...</option>
                    <option *ngFor="let range of allPossibleRanges" [ngValue]="range.iri">
                        {{ range.label }}
                    </option>
                    </select>
                </div>

                <!-- anchor for the dynamically created component -->
                <ng-container #subEntityAnchor></ng-container>

            </div>
            
            <div *ngIf="association.valueKind === 'literal'">
                <input
                type="text"
                [(ngModel)]="association.value"
                [ngModelOptions]="{standalone: true}"
                [placeholder]="'Enter a value'"
                class="w-full text-sm border border-gray-300 rounded-md px-2 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"/>
            </div>

            <div class="flex mt-2 gap-2 pt-1">
                <button
                    (click)="confirm()"
                    [disabled]="!association.mode || !association.value || !association.predicate"
                    class="cursor-pointer! flex-1 text-sm py-1.5 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors font-medium">
                    Confirm
                </button>
                <button
                    (click)="cancelAddAssociation()"
                    class="cursor-pointer! flex-1 text-sm py-1.5 border border-gray-300 text-gray-600 rounded-md hover:bg-gray-100 transition-colors font-medium">
                    Cancel
                </button>
            </div>
        </div>

    </div>
    </mat-radio-group>

    
        
</div>
