<div class="p-6 overflow-y-auto max-h-[calc(90vh-100px)]">
  <form [formGroup]="entityForm" class="space-y-6">

    <!-- Entity Type -->
    <div class="w-full flex flex-col gap-2">

        <div class="flex items-center justify-between mb-3">
            <label class="flex items-center gap-3 text-sm font-medium text-gray-700">
                Entity type(s) *

                <button
                type="button"
                class="grid place-items-center w-8 h-8 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition leading-none"
                title="Add new type"
                >
                <svg
                    class="w-5 h-5"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                >
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12M6 12h12"/>
                </svg>
                </button>

            </label>
        </div>

        <mat-chip-grid #chipGrid *ngIf="listSelectedTypes.length > 0">
            <mat-chip-row *ngFor="let selectedType of listSelectedTypes">
                {{selectedType.label}}
                <button 
                    matChipRemove [attr.aria-label]="'remove '"
                    (click)="removeChip(selectedType.label)">
                    <mat-icon>cancel</mat-icon>
                </button>
            </mat-chip-row>
            
        </mat-chip-grid>

        <div class="flex flex-col gap-3">

            <div>
            @if(dialogData.ontologiesData && !dialogData.type){
                <mat-button-toggle-group name="fontStyle" aria-label="Font Style">

                    <mat-button-toggle
                    *ngFor="let ontology of dialogData.ontologiesData | keyvalue" 
                    (click)="setSelectedOntology(ontology.value)"
                    [value]="ontology.key" 
                    >
                        {{ getName(ontology) }}
                    </mat-button-toggle>

                    <mat-button-toggle 
                        (click)="setSelectedOntology(null)"
                    >
                        Other ontologies
                    </mat-button-toggle>

                </mat-button-toggle-group>
            }
            </div>


            <div *ngIf="selectedOntology" class="p-4 bg-gray-50 border border-gray-200 rounded-lg">
                <label class="block text-xs font-medium text-gray-700 mb-2">Select a type</label>
                <select formControlName="entityType"
                    class="cursor-pointer w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm transition-all">

                    <option value="" disabled>
                        Select a type…
                    </option>

                    <optgroup *ngIf="selectedOntology.mainTypes" label="Main Types">
                        <option *ngFor="let t of selectedOntology.mainTypes.value" [value]="t">
                            {{ extractEntityTypeFromIRI(t) }}
                        </option>
                    </optgroup>

                    <optgroup *ngIf="selectedOntology.usedTypes" label="Used Types">
                        <option *ngFor="let t of selectedOntology.usedTypes.value" [value]="t">
                            {{ extractEntityTypeFromIRI(t) }}
                        </option>
                    </optgroup>

                    <optgroup *ngIf="selectedOntology.mainTerminologies" label="Main Terminologies">
                        <option *ngFor="let t of selectedOntology.mainTerminologies.value" [value]="t">
                            {{ extractEntityTypeFromIRI(t) }}
                        </option>
                    </optgroup>

                    <optgroup *ngIf="selectedOntology.definedTypes" label="Other">
                        <option *ngFor="let t of selectedOntology.definedTypes.value" [value]="t.uri">
                            {{ t.label }}
                        </option>
                    </optgroup>

                </select>
                <p class="mt-1.5 text-xs text-gray-400">Types are fetched from the RDF graph base.</p>
            </div>

            <!-- Custom type panel -->
            <div *ngIf="typeMode === 'custom'" class="p-4 bg-gray-50 border border-gray-200 rounded-lg space-y-4">
                <span>In Developement ...</span>
            </div>

            <div *ngIf="entityForm.get('entityType')?.invalid && entityForm.get('entityType')?.touched"
            class="mt-1 text-xs text-red-600">
            Entity type is required.
            </div>

        </div>
        


    </div>

    @if (dialogData.type || inputData ){
    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg">
        <label class="block text-xs font-medium text-gray-700 mb-2">Selected type</label>

        <p>
            {{ availableTypes }}
        </p>
    </div>
    }

    <!-- Associations section -->
    <div class="flex flex-col gap-2">
      <!-- Inline form -->
      <div class="mt-3 p-3 border border-blue-200 bg-blue-50 rounded-lg flex flex-col gap-3!">
        <div class="flex-1">
            <label class="block text-xs font-medium text-gray-600 mb-1">Entity Name</label>
            <input
                formControlName="propertyValue"                
                type="text"
                [placeholder]="'Enter a value'"
                class="w-full text-sm border border-gray-300 rounded-md px-2 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"/>
            </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
      <button type="button" (click)="cancelNewEntity()"
        class="px-4 py-2.5 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors text-sm font-medium">
        Cancel
      </button>
      <button (click)="saveNewEntity()" type="submit" [disabled]="entityForm.invalid"
        class="px-4 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
        Create
      </button>
    </div>

  </form>
</div>
