<div class="flex flex-col h-screen bg-gray-50">
  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-900 to-blue-600 shadow-lg">
    <div class="flex items-center justify-between px-6 py-4">

      <!-- Left: Logo and Title -->
      <div class="flex items-center gap-4">
        <div class="flex items-center justify-center w-10 h-10 bg-white/20 backdrop-blur-sm rounded-xl hover:bg-white/30 transition-all duration-300 cursor-pointer">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 17l10 5 10-5"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 12l10 5 10-5"></path>
          </svg>
        </div>


        <div>
          <h1 *ngIf="projectName; else spinner" class="text-xl font-bold text-white tracking-tight">
            {{ projectName }}
          </h1>
          <ng-template #spinner>
            <div class="flex items-center gap-2">
              <svg class="animate-spin h-5 w-5 text-white opacity-70" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
              <span class="text-white opacity-50 text-sm italic">Loading...</span>
            </div>
          </ng-template>
          <p class="text-xs text-blue-100">RDF Entity Management System</p>
        </div>
      </div>


      <!-- Right: View Tabs -->

      <div class="flex items-center gap-4">
        <button 
          (click)="router.navigate(['/gestion-projets'])"
          class="cursor-pointer flex items-center gap-2 px-3 py-1.5 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-lg transition-colors">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span class="text-sm text-white font-medium">Projects</span>
        </button>
        <button 
          (click)="router.navigate(['/gestion-sources'])"
          class="cursor-pointer flex items-center gap-2 px-3 py-1.5 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-lg transition-colors">
          <span class="text-sm text-white font-medium">Datasources</span>
          <svg class="w-4 h-4 text-white rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <button (click)="setView('sparql')" [class.bg-white]="activeView === 'sparql'" [class.text-blue-600]="activeView === 'sparql'" [class.shadow-sm]="activeView === 'sparql'" class="cursor-pointer flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-all duration-200 hover:bg-white/20" role="tab" [attr.aria-selected]="activeView === 'sparql'" aria-label="SPARQL view">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <polyline points="16 18 22 12 16 6" stroke-width="2"></polyline>
            <polyline points="8 6 2 12 8 18" stroke-width="2"></polyline>
          </svg>
          <span>SPARQL</span>
      </button>
      </div>   
        

    </div>
  </header>

  <!-- Main Content Area -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside *ngIf="activeView !== 'sparql'" class="w-[35%] bg-white border-r border-gray-200 overflow-y-auto shadow-sm flex flex-col">
      <div class="p-4 flex-1">

        <!-- Header section with gradient accent -->
        <div class="flex mb-4 pb-2 border-b border-gray-100 items-center justify-between">

          <!-- Left side -->
          <div class="flex items-center gap-3">

            <!-- Manage button (cleaner + modern) -->
            <button 
              class="cursor-pointer flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-gray-50 hover:text-gray-900 border-none transition-all duration-200 shadow-sm hover:shadow">
              
              <!-- Clean gear/sliders icon -->
              <svg 
                class="w-4 h-4" 
                fill="none" 
                stroke="blue" 
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>

            </button>

            <!-- Title -->
            <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wider">
              RDF Dictionaries
            </h2>

          </div>

          <!-- Right side badge -->
          <!-- <span class="inline-flex items-center justify-center px-2.5 py-0.5 text-xs font-medium rounded-full bg-gray-100 text-gray-600">
            {{ formattedEntities?.length }}
          </span> -->

        </div>
        
        <mat-accordion class="flex flex-col gap-2">

          <mat-expansion-panel 
            *ngFor="let ontology of ontologyLabels | keyvalue" 
            class="border-none! shadow-none! rounded-lg! overflow-hidden transition-all duration-200"
            [class.!bg-gray-50]="panelOpenState()"
            (opened)="panelOpenState.set(true)" 
            (closed)="panelOpenState.set(false)">
            
            <mat-expansion-panel-header class="px-3! py-2! hover:bg-gray-50! transition-colors duration-150 rounded-lg">
              <mat-panel-title class="text-sm font-medium text-gray-700">
                {{ ontology.value.name }}
              </mat-panel-title>
              <mat-panel-description class="justify-end">
                <span class="text-xs text-gray-400">{{ getLength(ontology.value)}} </span>
              </mat-panel-description>
            </mat-expansion-panel-header>

            <cdk-accordion class="example-accordion">
              @for (item of getOntologySections(ontology.value); track item; let index = $index) {
              <cdk-accordion-item #accordionItem="cdkAccordionItem" class="example-accordion-item">
                <button
                  class="example-accordion-item-header p-5!"
                  (click)="accordionItem.toggle()"
                  tabindex="0"
                  [attr.id]="'accordion-header-' + index"
                  [attr.aria-expanded]="accordionItem.expanded"
                  [attr.aria-controls]="'accordion-body-' + index">

                <div class="flex items-center justify-between w-full">
                  <span>{{ item.name }}</span>
                  <span class="text-xs text-gray-400 mr-2">
                    ({{ item.value.length }})
                  </span>
                </div>

                <span class="example-accordion-item-description flex items-center">
                  <svg
                    class="w-5 h-5 transition-transform duration-300"
                    [ngClass]="{ 'rotate-180': accordionItem.expanded }"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 9l-7 7-7-7"
                    />
                  </svg>
                </span>
                </button>

                @if (accordionItem.expanded) {
                  <button 
                    *ngFor="let entityType of item.value"
                    [class.bg-blue-50]="selectedType === entityType"
                    [class.border-l-3]="selectedType === entityType"
                    [class.border-l-blue-500]="selectedType === entityType"
                    [class.text-blue-700]="selectedType === entityType"
                    class="w-full text-center px-4 py-3 text-sm rounded-lg hover:bg-gray-50 transition-all duration-150 group relative"
                    [attr.aria-pressed]="selectedType === entityType"
                    (click)="getAllEntitiesByPath(ontology.value.name, entityType)"
                  >

                    <div class="flex items-center justify-between">
                      <span class="text-sm font-medium group-hover:text-gray-900">
                        {{ extractEntityTypeFromIRI(entityType) }}
                      </span>

                      <span *ngIf="selectedType === entityType" class="text-blue-500 text-xs">
                        ●
                      </span>
                    </div>

                  </button>
                }
              </cdk-accordion-item>
              }
            </cdk-accordion>

          </mat-expansion-panel>

        </mat-accordion>

        <!-- Enhanced empty state with better visual feedback -->
        <div *ngIf="ontologyLabels.length === 0" class="text-center py-12 px-4">
          <div class="inline-flex items-center justify-center w-12 h-12 bg-gray-50 rounded-full mb-3">
            <svg class="h-6 w-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
          <p class="text-sm font-medium text-gray-500">No types found</p>
          <p class="text-xs text-gray-400 mt-1">Try adjusting your search</p>
        </div>
      </div>
    </aside>

    <div  *ngIf="activeView === 'tableau'" class="p-0! w-[85%]!" [@slideIn]>
      <div class="p-1! flex-1 overflow-y-auto bg-gray-50 ">
        <app-liste-entites [ontologiesData]="ontologyLabels" *ngIf="formattedEntities" [selectedType]="`${selectedOntology}:${selectedType}`" [allEntities]="formattedEntities" (selectedEntity)="handleChildData($event)"></app-liste-entites>
      </div>    
    </div>

    <div *ngIf="activeView === 'sparql'" class="flex-1 flex items-start justify-center overflow-y-auto bg-gray-50" [@slideIn]>
      <div class="w-full max-w-5xl">
        <app-sparql></app-sparql>
      </div>
    </div>

  </div>

</div>
