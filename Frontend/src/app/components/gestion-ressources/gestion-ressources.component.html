<div class="flex flex-col h-full bg-gray-50">
  <!-- Main Content Area -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Type navigator -->
    <aside class="w-64 shrink-0 bg-white border-r border-gray-200 overflow-y-auto">
      <div class="p-3">
        <h2 class="text-xs uppercase tracking-wide text-gray-500 mb-2">RDF dictionaries</h2>

        <div *ngFor="let ontology of ontologyLabels | keyvalue:ontologyOrderComparator" class="mb-1">
          <!-- Ontology -->
          <button type="button"
                  class="w-full flex items-center gap-1.5 px-2 py-1 rounded text-sm font-medium text-gray-800 hover:bg-gray-50"
                  [attr.aria-expanded]="isOpen(ontology.key)"
                  [matTooltip]="ontology.key" matTooltipShowDelay="600"
                  (click)="toggle(ontology.key)">
            <span class="w-3 text-xs text-gray-400">{{ isOpen(ontology.key) ? '▾' : '▸' }}</span>
            <span class="truncate">{{ ontology.value.name }}</span>
            <span class="flex-1"></span>
            <span class="text-xs text-gray-400">{{ getLength(ontology.value) }}</span>
          </button>

          <div *ngIf="isOpen(ontology.key)" class="ml-3 pl-2 border-l border-gray-200 mb-1">
            <div *ngFor="let section of getOntologySections(ontology.value)">
              <!-- Section: main types, used types, main terminologies -->
              <button type="button"
                      class="w-full flex items-center gap-1 px-1 pt-1.5 pb-0.5 section-label hover:text-gray-700"
                      [attr.aria-expanded]="isOpen(ontology.key + '|' + section.name)"
                      (click)="toggle(ontology.key + '|' + section.name)">
                <span class="w-3">{{ isOpen(ontology.key + '|' + section.name) ? '▾' : '▸' }}</span>
                <span>{{ section.name || 'Types' }}</span>
                <span class="flex-1"></span>
                <span class="normal-case tracking-normal">{{ section.value.length }}</span>
              </button>

              <ng-container *ngIf="isOpen(ontology.key + '|' + section.name)">
                <button *ngFor="let entityType of section.value" type="button"
                        class="w-full text-left px-2 py-0.5 rounded text-sm truncate border-l-2"
                        [ngClass]="selectedType === entityType
                          ? 'bg-blue-50 text-blue-700 border-blue-500'
                          : 'text-gray-700 border-transparent hover:bg-gray-50'"
                        [attr.aria-pressed]="selectedType === entityType"
                        [matTooltip]="entityType" matTooltipShowDelay="600" matTooltipPosition="right"
                        (click)="getAllEntitiesByPath(ontology.value.name, entityType)">
                  {{ extractEntityTypeFromIRI(entityType) }}
                </button>
              </ng-container>
            </div>
            <p *ngIf="!getOntologySections(ontology.value).length" class="px-1 py-1 text-xs text-gray-400 italic">No type.</p>
          </div>
        </div>

        <!-- Entities without rdf:type -->
        <button type="button"
                class="w-full text-left mt-1 px-2 py-1 rounded text-sm border-l-2"
                [ngClass]="untypedSelected
                  ? 'bg-blue-50 text-blue-700 border-blue-500'
                  : 'text-gray-800 border-transparent hover:bg-gray-50'"
                [attr.aria-pressed]="untypedSelected"
                (click)="getAllEntitiesWithoutType()">
          Not typed
        </button>

        <p *ngIf="loaded && !(ontologyLabels | keyvalue).length" class="text-sm text-gray-500 italic p-2">No types found.</p>
      </div>
    </aside>

    <div class="flex-1 min-w-0 overflow-hidden" [@slideIn]>
      <div class="h-full p-1 overflow-y-auto bg-gray-50">

      <app-liste-entites
        [ontologiesData]="ontologyLabels"
        [selectedType]="selectedType"
        [allEntities]="formattedEntities || []"
        [isLoading]="isLoadingEntities"
        (selectedEntity)="handleChildData($event)"
        (entityCreated)="onEntityCreated()">
      </app-liste-entites>

      </div>
    </div>

  </div>

</div>
