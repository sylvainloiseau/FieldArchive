@let project = activeProject$ | async;
<header class="bg-gradient-to-r from-blue-900 to-blue-600 shadow-lg">
  <div class="flex items-center justify-between gap-6 px-6 py-4">

    <!-- Left: logo + active project -->
    <div class="flex items-center gap-4 shrink-0">
      <div routerLink="/gestion-projets" class="flex items-center justify-center w-10 h-10 bg-white/20 backdrop-blur-sm rounded-xl hover:bg-white/30 transition-all duration-300 cursor-pointer">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 17l10 5 10-5"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 12l10 5 10-5"></path>
        </svg>
      </div>

      @if (project?.name) {
        <div class="flex items-center gap-2">
          <h1 class="text-xl font-bold text-white tracking-tight">{{ project?.name }}</h1>
          <button (click)="onCloseProject()" class="cursor-pointer text-white/70 hover:text-white transition-colors" title="Close project">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      }
    </div>

    <!-- Middle: ask a question in natural language -->
    <div class="flex-1 flex justify-center min-w-0">
      <!-- wide windows: the field -->
      <div class="relative w-full max-w-xl hidden lg:block" [title]="project?.name ? '' : 'Open a project first'">
        <button (click)="ask()" [disabled]="!project?.name" title="Ask a question"
                class="absolute left-2 top-1/2 -translate-y-1/2 p-1 rounded-md text-white/70 hover:text-white disabled:cursor-not-allowed disabled:opacity-40">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
          </svg>
        </button>
        <input #askInput type="text" [(ngModel)]="question" [disabled]="!project?.name"
               [matAutocomplete]="recentQuestions"
               (focus)="onFocus()" (keydown.enter)="onEnter()" (keydown.escape)="onEscape()"
               placeholder="Ask about this project… (e.g. list all persons)"
               class="w-full pl-9 pr-12 py-1.5 rounded-lg bg-white/10 focus:bg-white/20 text-sm text-white placeholder-white/60 border border-white/10 focus:outline-none focus:ring-1 focus:ring-white/40 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
        @if (!question && project?.name) {
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] text-white/50 pointer-events-none">{{ isMac ? '⌘K' : 'Ctrl K' }}</span>
        }
        <mat-autocomplete #recentQuestions="matAutocomplete">
          @for (s of suggestions; track s) {
            <mat-option [value]="s"><span class="text-sm">{{ s }}</span></mat-option>
          }
        </mat-autocomplete>
      </div>
      <!-- narrow windows: the icon only -->
      <button (click)="ask()" [disabled]="!project?.name" [title]="project?.name ? 'Ask a question' : 'Open a project first'"
              class="lg:hidden cursor-pointer p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white disabled:opacity-40 disabled:cursor-not-allowed">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
        </svg>
      </button>
    </div>

    <!-- Right: navigation -->
    <nav class="flex items-center gap-4 shrink-0">
      @for (item of navItems; track item.path) {
        <button
          [routerLink]="item.path"
          routerLinkActive="bg-white! text-blue-600! shadow-sm"
          [disabled]="item.needsProject && !project"
          [title]="item.needsProject && !project ? 'Open a project first' : ''"
          class="cursor-pointer flex items-center gap-2 px-3 py-1.5 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-lg transition-colors text-sm text-white font-medium disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white/10">
          {{ item.label }}
        </button>
      }

      <button
        routerLink="/gestion-projets"
        routerLinkActive="bg-white! text-blue-600! shadow-sm"
        class="ml-10 cursor-pointer flex items-center gap-2 px-3 py-1.5 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-lg transition-colors text-sm text-white font-medium">
        Projects
      </button>
    </nav>

  </div>
</header>
