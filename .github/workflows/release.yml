      #   run: |
      #     mvn -B -ntp clean package -pl lift-gui -am -Pdist -DskipTests \
      #       "-Djavafx.platform=${{ matrix.javafx }}" \
      #       -Djpackage.type=DMG

      - name: Publish artifacts on the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            dist-electron/**/*
