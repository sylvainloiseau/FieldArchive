name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.runner }} (${{ matrix.javafx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            javafx: linux
          - runner: windows-latest
            javafx: win
          - runner: macos-latest
            javafx: mac-aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Maven 3.9.9
        shell: bash
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz" | tar xz -C /tmp
          echo "/tmp/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Install Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install root dependencies
        shell: bash
        run: npm ci

      - name: Install frontend dependencies
        shell: bash
        run: npm ci --prefix Frontend

      - name: generate App
        shell: bash
        run: npm run dist

      - name: Publish artifacts on the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            ## First launch on macOS

            The macOS application is **not notarized by Apple** (notarization requires a paid
            Developer ID this project does not have), so the first launch of the downloaded
            app shows « Apple n'a pas pu confirmer que "FieldArchive" ne contenait pas de
            logiciel malveillant… ». This is expected. Lift the restriction once, using
            either route:

            - **System Settings** (all recent macOS, including 15 Sequoia): drag
              `FieldArchive.app` to `/Applications`, double-click it, dismiss the warning,
              then open **System Settings → Privacy & Security**, and at the bottom of the
              **Security** section click **Ouvrir quand même / Open Anyway** and confirm with
              Touch ID or your password. On Sequoia, a second double-click and confirmation
              may be needed.
            - **Terminal** (one command), after copying the app to `/Applications`:
              ```
              xattr -dr com.apple.quarantine /Applications/FieldArchive.app
              ```

            Right-click → **Ouvrir** worked up to macOS 14 but no longer bypasses this check
            on macOS 15 (Sequoia). See the [README](https://github.com/sylvainloiseau/FieldArchive#first-launch-on-macos)
            for details.
          files: |
            dist-electron/*.dmg
            dist-electron/*.dmg.blockmap
            dist-electron/*.exe
            dist-electron/*.exe.blockmap
            dist-electron/*.AppImage
            dist-electron/*.AppImage.blockmap
            dist-electron/latest*.yml
