spring.application.name=FieldArchiveBackend

# Natural-language queries (the "Ask" field and dialog)
fieldarchive.nlquery.claude.model=claude-opus-5-5
# Server-side refusal fallback on Claude (a declined request is re-run on a fallback model)
fieldarchive.nlquery.claude.fallbacks=true
fieldarchive.nlquery.openai.model=gpt-6-astra
fieldarchive.nlquery.max-output-tokens=16000
fieldarchive.nlquery.max-turns=8
fieldarchive.nlquery.total-timeout-seconds=180
fieldarchive.nlquery.local.base-url=http://localhost:11434/v1
fieldarchive.nlquery.local.model=gpt-oss:20b
fieldarchive.nlquery.local.timeout-seconds=300
fieldarchive.nlquery.local.total-timeout-seconds=900
# Real records sent to the paid agents as patterns (0 = none)
fieldarchive.nlquery.sample-entities=1
fieldarchive.nlquery.rico-scope-notes=true
